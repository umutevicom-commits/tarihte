name: Günlük Tarihte Bugün RSS Üretimi

on:
  schedule:
    # Her gün 03:00 UTC (TR saatiyle yaz saatinde 06:00) çalışır
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # Elle tetiklemek için (Actions sekmesinden "Run workflow")

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: RSS ve makaleleri üret
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/generate.py

      - name: Değişiklikleri commit'le ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --quiet --cached || git commit -m "chore: günlük Tarihte Bugün güncellemesi $(date -u +%Y-%m-%d)"
          git push

name: GSMArena Türkçe RSS Üretimi

on:
  schedule:
    # Her 2 saatte bir çalışır (GSMArena akışı gün içinde sık güncellenir)
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # Elle tetiklemek için (Actions sekmesinden "Run workflow")

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: RSS ve makaleleri üret
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
        run: python scripts/generate.py

      - name: Değişiklikleri commit'le ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --quiet --cached || git commit -m "chore: GSMArena TR akışı güncellemesi $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
